sentence=Offline ESP32 knowledge engine with calculator, telemetry, diagnostics and health scoring.
paragraph=AmelTech lab's bot is a complete offline-capable Arduino library for ESP32. It provides a trainable knowledge base with exact, keyword and fuzzy matching, a safe expression calculator, conversation context, ESP32 hardware telemetry, diagnostics and an explainable health score. Built-in knowledge is embedded in flash; user knowledge can be persisted via NVS. No network is required for core operation.
