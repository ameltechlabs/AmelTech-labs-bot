sentence=Offline ESP32 chatbot with a deterministic neural-style matcher, full calculator, DHT11/DHT22 sensing, name memory and weighted health diagnostics.
paragraph=AmelTech lab's bot is a complete offline Arduino library for ESP32. A two-stage matcher (token signature and trigram prefilter, then blended scoring over a 48-dimension deterministic embedding) answers natural questions from 2037 built-in entries in well under a millisecond. It also includes a full expression calculator with 30+ functions, self-contained DHT11/DHT21/DHT22 support with dew point, heat index and comfort analysis, name memory for up to 34 people that survives a power cycle, a serial training console with data number codes, thermal protection, and confidence-weighted health diagnostics. Nothing is invented: unavailable measurements are reported as unavailable. No network is required.
