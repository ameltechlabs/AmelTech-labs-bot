sentence=Offline-capable ESP32 knowledge assistant with a trainable Q&A engine, safe calculator, and hardware telemetry/diagnostics.
paragraph=AmelTechBot combines an offline question-answer engine (exact, keyword, fuzzy, and lightweight semantic-style matching), a bounded conversation context, a safe arithmetic calculator, and evidence-based ESP32 hardware telemetry/diagnostics/health scoring into a single Arduino library. Built-in knowledge ships in flash; user knowledge is trainable at runtime and optionally persisted to NVS. Telemetry never fabricates values: unsupported or unmeasured fields are explicitly marked UNSUPPORTED/UNAVAILABLE.
